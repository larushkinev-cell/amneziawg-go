name: sync-upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
    steps:
      - name: merge upstream into fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "default branch: ${{ github.event.repository.default_branch }}"
          if ! gh api -X POST "repos/${{ github.repository }}/merge-upstream" \
               -f branch="${{ github.event.repository.default_branch }}" > /tmp/sync.out 2>/tmp/sync.err; then
            echo "merge-upstream failed"; cat /tmp/sync.err
            gh issue create --title "upstream sync failed ($(date -u +%F))" \
              --body "Автоматический merge upstream не прошёл. Нужна ручная правка.

$(cat /tmp/sync.err)" || true
            exit 1
          fi
          cat /tmp/sync.out
      - name: alert webhook
        if: failure()
        run: |
          if [ -n "${ALERT_WEBHOOK:-}" ]; then
            curl -fsS -X POST "$ALERT_WEBHOOK" -H 'content-type: application/json' \
              -d "{\"title\":\"${{ github.repository }}: upstream sync failed\",\"text\":\"Конфликт/ошибка merge с upstream; нужна ручная правка.\"}" || true
          fi
